site_name: lamnhac
site_description: Chuyển MP3 guitar solo thành tab Guitar Pro (.gp5) và MusicXML, chạy offline
site_author: nguyenhuuca
site_url: https://nguyenhuuca.github.io/lamnhac/
repo_url: https://github.com/nguyenhuuca/lamnhac
repo_name: nguyenhuuca/lamnhac
edit_uri: edit/main/docs/
copyright: lamnhac

# docs are written for GitHub (2-space nested lists, no blank line before a list); see the hook
hooks:
  - scripts/mkdocs_hooks.py

theme:
  name: material
  language: vi
  icon:
    repo: fontawesome/brands/github
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - search.highlight
    - search.suggest
    - content.code.copy
    - content.action.edit
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep orange
      accent: amber
      toggle:
        icon: material/brightness-7
        name: Chế độ tối
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep orange
      accent: amber
      toggle:
        icon: material/brightness-4
        name: Chế độ sáng

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true

# The spec, ADR and plan cite repository paths in prose; links that leave docs/ are expected
validation:
  links:
    not_found: warn
    unrecognized_links: info

nav:
  - Trang chủ: index.md
  - Hướng dẫn: guide.md
  - Thuật toán: algorithms.md
  - Thiết kế:
      - PRD: prd/PRD-mp3-to-guitarpro.md
      - "PRD hợp âm": prd/PRD-chords-from-song.md
      - Spec: specs/spec-mp3-to-guitarpro.md
      - Sequence diagrams: sequence/sequence-mp3-to-guitarpro.md
      - "Spec hợp âm": specs/spec-chords-from-song.md
      - "Sequence hợp âm": sequence/sequence-chords-from-song.md
      - "ADR-0001 Thư viện nhận nốt và xuất file": adr/0001-transcription-and-export-libraries.md
  - Dự án:
      - Plan: plans/plan-mp3-to-guitarpro.md
      - Tiến độ: tracking.md
      - "Báo cáo spike cài đặt": reports/spike-2026-11-13-install.md
      - "Báo cáo eval G1": reports/eval-2026-11-14-g1.md
